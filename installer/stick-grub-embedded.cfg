# XGS installer stick: find THIS stick (not the SSD's /EFI/debian) and show its menu.
# 'source' (not configfile) so ESC in the menu cannot drop out to a nested prompt;
# $prefix stays on the built-in memdisk, where the modules are.
search --no-floppy --file --set=root /.disk/id/19d5b690-0f60-4b5d-9755-2b7afd177e7e
source ($root)/boot/grub/grub.cfg
